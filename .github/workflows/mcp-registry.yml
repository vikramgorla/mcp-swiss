name: Publish to MCP Registry

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write  # Required for GitHub OIDC authentication

# Only one registry publish at a time
concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for npm propagation
        # Poll until the version in server.json is visible on npm (Release
        # publishes it in parallel); up to ~20 minutes with backoff.
        run: |
          VERSION=$(jq -r '.packages[0].version' server.json)
          NAME=$(jq -r '.packages[0].identifier' server.json)
          delay=15
          deadline=$(( $(date +%s) + 1200 ))
          until curl -fsS "https://registry.npmjs.org/${NAME}/${VERSION}" -o /dev/null; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::${NAME}@${VERSION} not visible on npm after 20 minutes"
              exit 1
            fi
            echo "⏳ ${NAME}@${VERSION} not on npm yet, retrying in ${delay}s"
            sleep "$delay"
            delay=$(( delay < 120 ? delay * 2 : 120 ))
          done
          echo "✅ ${NAME}@${VERSION} is on npm"
          # Small buffer for the registry's own npm lookup
          sleep 20

      - name: Install mcp-publisher
        env:
          # Pinned and checksummed (from registry_1.8.15_checksums.txt on the
          # release) instead of running "latest" in a job that holds an OIDC
          # publish token. Bump both together when upgrading.
          PUBLISHER_VERSION: v1.8.15
          PUBLISHER_SHA256: 8beca8143ae8a034c87c99a57e8cb1b6c2cee7874fcf8a20a8adbda84b291b5e
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Authenticate with MCP Registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: mcp-publisher publish server.json
